plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.13.0",
            "org.junit.jupiter:junit-jupiter:5.9.1",
            "net.datafaker:datafaker:2.7.0",
            "io.qameta.allure:allure-junit5:2.29.1",
            "io.qameta.allure:allure-selenide:2.29.1",
    )
}

test {
    useJUnitPlatform()
    systemProperty 'selenide.headless', System.getProperty('selenide.headless', 'true')
}

allure {
    version = '2.32.0'
    adapter {
        allureJavaVersion = '2.29.1'
        aspectjWeaver = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}
